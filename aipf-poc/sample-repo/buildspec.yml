version: 0.2

env:
  variables:
    DATABASE_URL: postgres://postgres:dev@localhost:5432/app

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - docker run -d --name db -e POSTGRES_PASSWORD=dev -e POSTGRES_DB=app -p 5432:5432 public.ecr.aws/docker/library/postgres:16-alpine
      - npm ci
  pre_build:
    commands:
      - for i in $(seq 1 30); do docker exec db pg_isready -h 127.0.0.1 -U postgres && break; sleep 2; done
      - npm run db:migrate
      - npm run db:seed
  build:
    commands:
      - npm run lint
      - npm run test:unit
      - npm run test:integration
