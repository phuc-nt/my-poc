# The simulated environment: two services, their database, the identity provider and the third parties.
#   docker compose up -d --build --wait    start everything and wait for the health checks
#   docker compose --profile ci run --rm tests   run the Playwright suite inside the network, the way a pipeline would
# Every key and password below is a dummy that only exists in this file.

x-service-env: &service-env
  JWKS_URI: http://idp:8090/.well-known/jwks.json
  INTERNAL_API_KEY: local-only-internal-key
  PARTNER_API_KEY: local-only-partner-key
  THIRD_PARTY_URL: http://wiremock:8080
  EVENTS_URL: http://wiremock:8080
  DOWNSTREAM_TIMEOUT_MS: "2000"
  DB_USER: sim
  DB_PASSWORD: local-only-db-password
  RELAXED_CHARS: ${RELAXED_CHARS-|}
  API_DOCS_ENABLED: "true"

x-service-health: &service-health
  test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
  interval: 3s
  timeout: 3s
  retries: 40
  start_period: 10s

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sim
      POSTGRES_PASSWORD: local-only-db-password
    volumes:
      - ./sim/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sim -d service_b"]
      interval: 2s
      retries: 30

  wiremock:
    image: wiremock/wiremock:3.13.2
    command: ["--global-response-templating", "--disable-banner", "--max-request-journal-entries", "20000"]
    volumes:
      - ./sim/wiremock/mappings:/home/wiremock/mappings:ro
    ports: ["8089:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/__admin/health || exit 1"]
      interval: 2s
      retries: 30

  idp:
    image: node:22-alpine
    command: ["node", "/srv/server.mjs"]
    volumes:
      - ./sim/mock-idp/server.mjs:/srv/server.mjs:ro
    ports: ["8090:8090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/health | grep -q UP"]
      interval: 2s
      retries: 30

  service-a:
    build: { context: ./sim, args: { JAR: service-a/target/service-a.jar } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://db:5432/service_a
      FILE_SIGNING_KEY: local-only-file-signing-key
      EXPORT_DELAY_MS: "2000"
    ports: ["8081:8080"]
    depends_on:
      db: { condition: service_healthy }
      idp: { condition: service_healthy }
      wiremock: { condition: service_healthy }
    healthcheck: *service-health

  service-b:
    build: { context: ./sim, args: { JAR: service-b/target/service-b.jar } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://db:5432/service_b
      SERVICE_A_URL: http://service-a:8080
    ports: ["8082:8080"]
    depends_on:
      db: { condition: service_healthy }
      service-a: { condition: service_healthy }
    healthcheck: *service-health

  tests:
    profiles: ["ci"]
    image: node:22-bookworm-slim
    working_dir: /work
    command: ["bash", "scripts/pipeline.sh"]
    environment:
      TEST_ENV: compose
      CI: "true"
    volumes:
      - ./tests:/work
      # The container's own node_modules, so its npm ci never replaces the host's (built for another OS).
      - tests-node-modules:/work/node_modules
    depends_on:
      service-b: { condition: service_healthy }

volumes:
  tests-node-modules:
