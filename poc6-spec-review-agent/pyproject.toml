[project]
name = "spec-review"
version = "0.1.0"
description = "PoC 6: a spec review agent that writes a question list (質問表) from a synthetic Japanese specification"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "claude-agent-sdk>=0.2.180",
    "mcp>=2.3",
]

[project.scripts]
spec-review = "spec_review.cli:main"
spec-review-mcp = "spec_review.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
